<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 1280" width="960" height="1280" role="img" aria-label="Схема приточного клапана КИВ-125 в разрезе стены">
  <defs>
    <pattern id="hatch" width="18" height="18" patternUnits="userSpaceOnUse" patternTransform="rotate(45)">
      <line x1="0" y1="0" x2="0" y2="18" stroke="#a7aeb1" stroke-width="2"/>
    </pattern>
    <pattern id="wool" width="14" height="14" patternUnits="userSpaceOnUse">
      <circle cx="7" cy="7" r="2.2" fill="#a7aeb1"/>
    </pattern>
    <marker id="arrow" viewBox="0 0 12 12" refX="8" refY="6" markerWidth="12" markerHeight="12" orient="auto">
      <path d="M1 1 9 6 1 11" fill="none" stroke="#2e4a3d" stroke-width="2"/>
    </marker>
  </defs>

  <rect width="960" height="1280" fill="#e2e6e2"/>

  <!-- wall -->
  <rect x="400" y="0" width="190" height="1280" fill="#d3d8d4"/>
  <rect x="400" y="0" width="190" height="1280" fill="url(#hatch)"/>
  <line x1="400" y1="0" x2="400" y2="1280" stroke="#33393d" stroke-width="2"/>
  <line x1="590" y1="0" x2="590" y2="1280" stroke="#33393d" stroke-width="2"/>

  <!-- channel with insulation -->
  <rect x="390" y="572" width="210" height="136" fill="#f6f7f5"/>
  <rect x="400" y="572" width="190" height="20" fill="url(#wool)"/>
  <rect x="400" y="688" width="190" height="20" fill="url(#wool)"/>
  <line x1="390" y1="592" x2="640" y2="592" stroke="#33393d" stroke-width="2"/>
  <line x1="390" y1="688" x2="640" y2="688" stroke="#33393d" stroke-width="2"/>
  <line x1="400" y1="572" x2="590" y2="572" stroke="#33393d" stroke-width="1.5" stroke-dasharray="6 5"/>
  <line x1="400" y1="708" x2="590" y2="708" stroke="#33393d" stroke-width="1.5" stroke-dasharray="6 5"/>

  <!-- filter -->
  <rect x="540" y="594" width="30" height="92" fill="#a7aeb1" opacity=".55"/>
  <g stroke="#33393d" stroke-width="1.2">
    <line x1="540" y1="604" x2="570" y2="614"/><line x1="540" y1="622" x2="570" y2="632"/>
    <line x1="540" y1="640" x2="570" y2="650"/><line x1="540" y1="658" x2="570" y2="668"/>
    <line x1="540" y1="676" x2="570" y2="686"/>
  </g>
  <rect x="540" y="594" width="30" height="92" fill="none" stroke="#33393d" stroke-width="2"/>

  <!-- outside grille -->
  <rect x="352" y="548" width="38" height="184" fill="#33393d"/>
  <g stroke="#e2e6e2" stroke-width="3">
    <line x1="358" y1="572" x2="384" y2="562"/><line x1="358" y1="600" x2="384" y2="590"/>
    <line x1="358" y1="628" x2="384" y2="618"/><line x1="358" y1="656" x2="384" y2="646"/>
    <line x1="358" y1="684" x2="384" y2="674"/><line x1="358" y1="712" x2="384" y2="702"/>
  </g>

  <!-- inside regulating head -->
  <rect x="590" y="584" width="50" height="112" fill="#f6f7f5" stroke="#33393d" stroke-width="2"/>
  <rect x="652" y="560" width="16" height="160" rx="3" fill="#33393d"/>
  <line x1="640" y1="610" x2="652" y2="610" stroke="#33393d" stroke-width="2"/>
  <line x1="640" y1="670" x2="652" y2="670" stroke="#33393d" stroke-width="2"/>

  <!-- airflow -->
  <g fill="none" stroke="#2e4a3d" stroke-width="3" stroke-linecap="round" marker-end="url(#arrow)">
    <path d="M150 640H330"/>
    <path d="M150 600h120M150 680h120" opacity=".5"/>
    <path d="M420 640h100"/>
    <path d="M664 552c40-40 90-50 150-40"/>
    <path d="M664 728c40 40 90 50 150 40"/>
  </g>

  <!-- labels -->
  <g font-family="Golos Text, Helvetica, Arial, sans-serif" fill="#33393d">
    <text x="150" y="430" font-size="34" letter-spacing="1">Улица</text>
    <text x="700" y="430" font-size="34" letter-spacing="1">Комната</text>
    <text x="495" y="400" font-size="22" fill="#5d6468" text-anchor="middle">стена</text>

    <text x="150" y="860" font-size="24">Наружная решётка</text>
    <path d="M300 838 370 740" stroke="#33393d" stroke-width="1.5" fill="none"/>

    <text x="420" y="900" font-size="24">Утеплённый канал</text>
    <text x="420" y="932" font-size="24" fill="#5d6468">Ø 125 мм</text>
    <path d="M495 872 495 712" stroke="#33393d" stroke-width="1.5" fill="none"/>

    <text x="640" y="480" font-size="24">Фильтр</text>
    <path d="M650 488 566 590" stroke="#33393d" stroke-width="1.5" fill="none"/>

    <text x="700" y="860" font-size="24">Регулируемый</text>
    <text x="700" y="892" font-size="24">оголовок</text>
    <path d="M720 836 668 722" stroke="#33393d" stroke-width="1.5" fill="none"/>
  </g>

  <text x="80" y="1180" font-family="Tenor Sans, Georgia, serif" font-size="44" fill="#33393d">КИВ-125</text>
  <text x="80" y="1222" font-family="Golos Text, Helvetica, Arial, sans-serif" font-size="24" fill="#5d6468">Клапан инфильтрации воздуха, схема</text>
</svg>
